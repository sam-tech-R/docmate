<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocMate — Free Student Document Tools</title>
    <meta name="description" content="Useful image, PDF and document tools for students, applications and everyday file tasks." />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DocMate" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/docmate.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/docmate.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .docmate-light { background: #f8fafc !important; color: #334155 !important; }
      .docmate-light .bg-slate-950 { background-color: #ffffff !important; }
      .docmate-light .bg-slate-900, .docmate-light .bg-slate-900\/50, .docmate-light .bg-slate-900\/60, .docmate-light .bg-slate-900\/70 { background-color: #ffffff !important; }
      .docmate-light .bg-slate-950\/85, .docmate-light .bg-slate-950\/95 { background-color: rgba(255,255,255,.92) !important; }
      .docmate-light .bg-slate-800, .docmate-light .bg-slate-800\/50 { background-color: #f1f5f9 !important; }
      .docmate-light .border-slate-800, .docmate-light .border-slate-700, .docmate-light .border-slate-600 { border-color: #dbe4ee !important; }
      .docmate-light .text-white { color: #172033 !important; }
      .docmate-light .text-slate-200, .docmate-light .text-slate-300 { color: #334155 !important; }
      .docmate-light .text-slate-400 { color: #64748b !important; }
      .docmate-light .text-slate-500, .docmate-light .text-slate-600 { color: #7c8ba1 !important; }
      .docmate-light .hover\:bg-slate-800:hover { background-color: #e2e8f0 !important; }
      .docmate-light .hover\:bg-white\/5:hover { background-color: rgba(15,23,42,.06) !important; }
      .docmate-light .bg-cyan-500\/5 { background-color: #ecfeff !important; }
      .docmate-light .bg-cyan-500\/10 { background-color: #cffafe !important; }
      .docmate-light .bg-blue-500\/10 { background-color: #dbeafe !important; }
      .docmate-light .bg-amber-500\/10 { background-color: #fef3c7 !important; }
      .docmate-light .bg-emerald-500\/10 { background-color: #d1fae5 !important; }
      .docmate-light .bg-red-500\/10 { background-color: #fee2e2 !important; }
      .docmate-light .docmate-hero { background: linear-gradient(135deg, #ffffff 0%, #ecfeff 52%, #eff6ff 100%) !important; border-color: #a5f3fc !important; box-shadow: 0 18px 45px rgba(14, 165, 233, .10); }
      .docmate-light .docmate-hero .text-white { color: #172033 !important; }
      .docmate-light .docmate-hero .text-slate-400 { color: #52637a !important; }
      .docmate-light input, .docmate-light textarea, .docmate-light select { color: #172033 !important; background-color: #ffffff !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
